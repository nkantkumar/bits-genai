# Nginx configuration for Docker container (conf.d/default.conf)
limit_req_zone $binary_remote_addr zone=ai_gateway_limit:10m rate=10r/s;
limit_req_status 429;

upstream litellm_upstream {
    server litellm:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Health check
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status": "healthy", "service": "nginx-docker-ai-reverse-proxy"}';
    }

    # Proxy to internal LiteLLM container
    location / {
        limit_req zone=ai_gateway_limit burst=15 nodelay;

        proxy_pass http://litellm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming tokens
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    600s;

        add_header 'X-Reverse-Proxy-By' 'Nginx-AI-Gateway' always;
    }
}
