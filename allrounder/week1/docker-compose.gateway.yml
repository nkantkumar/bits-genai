services:
  # 1. Reverse Proxy Layer (Edge / Ingress)
  # Handles TLS termination, IP-based rate limiting, DDoS buffer, and SSE stream pass-through
  nginx:
    image: nginx:alpine
    container_name: ai_gateway_nginx
    restart: unless-stopped
    ports:
      - "8080:80"      # Public entry point (Change to "80:80" and "443:443" in production)
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - litellm
    networks:
      - ai_gateway_net

  # 2. AI Gateway Layer (LiteLLM)
  # Handles model routing, virtual keys, budgets, caching, retry/fallbacks
  # NOTE: Port 4000 is NOT exposed publicly on host - only accessible via nginx
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai_gateway_litellm
    restart: unless-stopped
    environment:
      - STORE_MODEL_IN_DB=True
      - LITELLM_MASTER_KEY=${LITELLM_API_KEY:-sk-master-key-here}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - ai_gateway_net

networks:
  ai_gateway_net:
    driver: bridge
