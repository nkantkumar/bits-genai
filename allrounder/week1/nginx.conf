# =============================================================================
# Production AI Gateway Reverse Proxy Configuration
# Architecture: Client -> Nginx (Port 8080) -> LiteLLM Proxy (Port 4000) -> LLMs
# =============================================================================

events {
    worker_connections 1024;
}

http {
    default_type  application/json;

    # Logging format with upstream latency and client IP
    log_format ai_gateway_log '[$time_local] client=$remote_addr '
                              'method=$request_method uri="$request_uri" '
                              'status=$status bytes_sent=$body_bytes_sent '
                              'request_time=$request_time upstream_time=$upstream_response_time '
                              'upstream_addr=$upstream_addr';

    access_log logs/access.log ai_gateway_log;
    error_log  logs/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # 1. Payload Limit: Allow large payloads (e.g., multimodal images, long context)
    client_max_body_size 50M;

    # 2. IP-based Rate Limiting Zone:
    # 10MB zone tracks ~160,000 IP addresses. Rate set to 10 requests/second per IP.
    limit_req_zone $binary_remote_addr zone=ai_gateway_limit:10m rate=10r/s;
    limit_req_status 429;

    # Upstream definition pointing to LiteLLM Proxy
    upstream litellm_backend {
        server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # 3. Health check directly on Nginx
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status": "healthy", "service": "nginx-ai-reverse-proxy"}';
        }

        # 4. Reverse Proxy all AI completion requests to LiteLLM
        location / {
            # Apply rate limiting: allow burst of up to 15 requests, reject excess with 429
            limit_req zone=ai_gateway_limit burst=15 nodelay;

            # Proxy to LiteLLM
            proxy_pass http://litellm_backend;

            # HTTP 1.1 with Keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Standard Forwarded Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # -------------------------------------------------------------
            # CRITICAL FOR LLM APIS: Server-Sent Events (SSE) & Streaming
            # Disables proxy buffering so tokens stream to client in real-time
            # -------------------------------------------------------------
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Long timeouts for extended reasoning / thinking models (e.g. o1/o3/Claude 3.7)
            proxy_connect_timeout 60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    600s;

            # CORS headers for web frontend consumers
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-litellm-user-id' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'X-Reverse-Proxy-By' 'Nginx-AI-Gateway' always;
        }
    }
}
