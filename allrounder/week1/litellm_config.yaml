# =============================================================================
# LiteLLM Gateway Configuration with Prompt & Semantic Caching
# =============================================================================

model_list:
  # 1. Cheap / Fast Model (for simple queries, lookups, formatting)
  - model_name: cheap
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # 2. Smart / Frontier Model (for complex analysis, code, multi-step reasoning)
  - model_name: smart
    litellm_params:
      model: gpt-4o-mini  # In production, change to gpt-4o or claude-3-5-sonnet
      api_key: os.environ/OPENAI_API_KEY

  # 3. Embedding Model (used by Semantic Cache to compute prompt similarity)
  - model_name: text-embedding-3-small
    litellm_params:
      model: text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

# General Gateway Settings
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

# Router & Load Balancing Settings
router_settings:
  routing_strategy: "latency-based-routing"
  num_retries: 2
  timeout: 30

# -----------------------------------------------------------------------------
# Caching Configuration: Exact Match & Semantic Caching
# -----------------------------------------------------------------------------
litellm_settings:
  # Enable Caching
  cache: true

  cache_params:
    type: "redis-semantic"
    redis_url: os.environ/REDIS_URL

    # Similarity Threshold (0.0 to 1.0)
    similarity_threshold: 0.85

    # Correct LiteLLM parameter name for semantic embedding model
    redis_semantic_cache_embedding_model: "text-embedding-3-small"

    # Cache namespace and TTL
    namespace: "ai_gateway_cache"
